name: AgentDashboard
options:
  bundleIdPrefix: dev.gooonzick
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
    Release:
      # Keeps Release ad-hoc builds without the runtime flag, so Sparkle.framework loads
      # without library validation (release.sh asserts the flag is absent).
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      ENABLE_HARDENED_RUNTIME: NO

packages:
  Core:
    path: Packages/Core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  AgentDashboard:
    type: application
    platform: macOS
    # The version lives in one file so Scripts/bump-version.sh can rewrite it.
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    sources:
      - path: App
    dependencies:
      - package: Core
        product: AppShell
      # Sparkle stays in the app target: the Core package does not know about it.
      - package: Sparkle
    # Merged with the keys Xcode generates (GENERATE_INFOPLIST_FILE). The Sparkle keys are custom, which
    # INFOPLIST_KEY_* cannot set. The versions are spelled out because XcodeGen would otherwise write 1.0 and 1.
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://github.com/gooonzick/agent-dashboard/releases/latest/download/appcast.xml
        # Replaced by the public half of the key that Sparkle's generate_keys makes; Scripts/release.sh refuses
        # to run while it is the placeholder.
        SUPublicEDKey: REPLACE_WITH_PUBLIC_ED_KEY
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gooonzick.AgentDashboard
        # Also becomes CFBundleName, which macOS shows in the app menu and the About panel.
        PRODUCT_NAME: Agent Dashboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent Dashboard
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
