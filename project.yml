name: AgentDashboard
options:
  bundleIdPrefix: dev.gooonzick
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual

packages:
  Core:
    path: Packages/Core

targets:
  AgentDashboard:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: Core
        product: AppShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gooonzick.AgentDashboard
        # Also becomes CFBundleName, which macOS shows in the app menu and the About panel.
        PRODUCT_NAME: Agent Dashboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent Dashboard
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
