# needs secrets.SPARKLE_PRIVATE_KEY and a runner with Xcode 27; until then releases are built with Scripts/release.sh
# and this workflow runs only by hand. Once SPARKLE_PRIVATE_KEY is set and releases are no longer made locally,
# re-enable the tag trigger by adding under `on:`
#   push:
#     tags: ["v*"]
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen create-dmg
          curl -fsSL -o /tmp/sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          mkdir -p "$HOME/bin/sparkle" && tar -xJf /tmp/sparkle.tar.xz -C "$HOME/bin/sparkle"

      - name: Write Sparkle key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is missing"
            exit 1
          fi
          umask 077
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_private_key"
          echo "SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle_private_key" >> "$GITHUB_ENV"
          echo "SPARKLE_BIN=$HOME/bin/sparkle/bin" >> "$GITHUB_ENV"

      - name: Build, sign ad hoc, package
        run: Scripts/release.sh

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/appcast.xml \
            --title "Agent Dashboard ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: agent-dashboard-dist
          path: |
            dist/*.dmg
            dist/appcast.xml
